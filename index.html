<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CI Challenge V5.1</title><script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script><style>body{margin:0;font-family:Segoe UI,sans-serif;background:linear-gradient(135deg,#0F172A,#1E3A8A,#0EA5E9);color:#fff}.container{max-width:1600px;margin:auto;padding:15px}.hero img{width:100%;height:220px;object-fit:cover;border-radius:20px}.card{background:#fff;color:#111827;border-radius:24px;padding:20px}.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.home-box{background:#F3F4F6;padding:24px;border-radius:20px}.player-input{width:450px;max-width:90%;display:block;margin:15px auto;padding:14px;font-size:18px}.primary{display:block;margin:15px auto 0;padding:16px 28px;border:none;border-radius:14px;background:#FF8F1F;color:#fff;font-size:20px}.secondary{width:100%;padding:8px 12px;min-height:48px;margin-top:8px;border:none;border-radius:12px;background:#E5E7EB}.progress{height:12px;background:#EAF2FF;border-radius:20px}.bar{height:12px;background:linear-gradient(90deg,#00A3E0,#00D084)}.question-th{font-size:22px;font-weight:700}.question-en{font-size:14px;color:#666}.answer-en{font-size:13px;color:#6B7280}.timer{text-align:center;color:#E11D48;font-size:34px;font-weight:700}.score{font-size:20px;color:#00A3E0;font-weight:bold}.result-card{text-align:center}.badge-box{display:inline-block;background:#FEF3C7;color:#92400E;padding:12px 24px;border-radius:999px}.score-big{font-size:72px;color:#00A3E0;font-weight:900}</style></head><body><audio id="applause" src="https://www.soundjay.com/human/applause-8.mp3"></audio><div id="app" class="container"></div><script>const FLOW_URL='https://default424992fe6af1421590b3fc5eb9c227.b3.environment.api.powerplatform.com/powerautomate/automations/direct/cu/20/workflows/ee283027fe704637bce41e8ed06ec781/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=hs_9P2KreWoZCpXGJb-APZw7FBgw3NAFZMcr0eCdzV8';const questions=[
[['คุณใช้เวลา 15 นาทีทุกเช้า Download Report, Copy Excel, Paste Excel และส่ง Email ทำมาแล้ว 2 ปี คุณควรทำอะไรก่อน?',''],[['ทำต่อไป เพราะเคยทำแบบนี้มาตลอด',''],['ขอคนเพิ่ม',''],['ตั้งคำถามว่า งานนี้ควรเป็นงานของคนหรือเครื่อง?',''],['กด Ctrl+C Ctrl+V ให้เร็วขึ้น','']],2],
[['หัวหน้าส่ง Email มา 5 หน้า ต้องการสรุปภายใน 3 นาที ใครควรทำงานส่วนแรก?',''],[['นั่งอ่านทีละบรรทัด',''],['ให้ AI ช่วยสรุป แล้วคนตรวจสอบต่อ',''],['พิมพ์ใหม่ทั้งหมด',''],['แกล้งออฟไลน์','']],1],
[['ขั้นตอนไหนไม่ได้เพิ่มคุณค่าให้ลูกค้า: 1) ลูกค้าส่งเอกสาร 2) Print 3) Scan กลับเข้าเครื่อง 4) Save PDF 5) ส่งต่อ',''],[['ข้อ 1',''],['ข้อ 2 และ 3',''],['ข้อ 4',''],['ทุกข้อ','']],1],
[['หากคุณมีงบทำ Improvement ได้แค่ 1 อย่าง คุณจะเลือกอะไร?',''],[['ซื้อ AI ที่แพงที่สุด',''],['ซื้อ RPA ทันที',''],['ซื้อจอใหญ่ขึ้น',''],['เข้าใจกระบวนการก่อน แล้วค่อยเลือก Lean, AI หรือ Automation','']],3],
[['จากสถานการณ์จงเลือก tool ที่เหมาะสมกับงานนี้ : ทีมงานเปิด Excel เช็ค Due Date แล้วส่งอีเมลติดตามทีละคนทุกวัน',''],[['A. Microsoft Copilot',''],['B. Cassidy AI',''],['C. Power Automate',''],['D. Power BI',''],['E. Lean / Redesign','']],2],
[['จากสถานการณ์จงเลือก tool ที่เหมาะสมกับงานนี้ : ผู้บริหารต้องการเห็นแนวโน้มงานค้าง โดยข้อมูลอยู่ใน Excel แต่ต้องรวมตัวเลขและทำกราฟใหม่ทุกสัปดาห์',''],[['A. Microsoft Copilot',''],['B. Cassidy AI',''],['C. Power Automate',''],['D. Power BI',''],['E. Lean / Redesign','']],3],
[['จากสถานการณ์จงเลือก tool ที่เหมาะสมกับงานนี้ : มีผู้อนุมัติหลายคน แต่ส่วนใหญ่ไม่เคยแก้ไขหรือให้ความเห็นทำให้งานใช้เวลานาน',''],[['A. Microsoft Copilot',''],['B. Cassidy AI',''],['C. Power Automate',''],['D. Power BI',''],['E. Lean / Redesign','']],4]
];let p='',i=0,s=0,t=15,bst=0,st=0,tm;function badge(x){if(x>=150)return'👑 CI Grand Master';if(x>=120)return'🏆 CI Champion';if(x>=90)return'⚡ Automation Builder';if(x>=60)return'🤖 AI Explorer';return'🏭 Lean Explorer';}function home(){app.innerHTML=`<div class='hero'><img src='LEANAI.png'></div><div class='card'><div class='home-grid'><div class='home-box'><h2>📋 How To Play</h2><p>✅ ตอบ 7 คำถาม / Answer 7 Questions</p><p>⏱ 15 วินาทีต่อข้อ / 15 Seconds</p><p>🎯 Correct = 20 + Remaining Time</p></div><div class='home-box'><h2>🏆 Achievement Levels</h2><p>👑 CI Grand Master : 150+</p><p>🏆 CI Champion : 120-149</p><p>⚡ Automation Builder : 90-119</p><p>🤖 AI Explorer : 60-89</p><p>🏭 Lean Explorer : Below 60</p></div></div><input id='n' class='player-input' placeholder='Player Name'><button class='primary' onclick='startGame()'>🚀 Start Mission</button></div>`}function startGame(){p=document.getElementById('n').value||'Anonymous';i=0;s=0;st=0;bst=0;showQ()}function showQ(){clearInterval(tm);t=15;let q=questions[i];app.innerHTML=`<div class='card'><div class='progress'><div class='bar' style='width:${(i+1)/questions.length*100}%'></div></div><h2>Question ${i+1}</h2><div class='question-th'>${q[0][0]}</div><div class='question-en'>${q[0][1]}</div><div class='score'>🏆 Score ${s}</div><div class='timer' id='tt'>⏱ ${t}</div>${q[1].map((a,x)=>`<button class='secondary' onclick='answer(${x})'><div>${a[0]}</div><div class='answer-en'>${a[1]}</div></button>`).join('')}</div>`;tm=setInterval(()=>{t--;let e=document.getElementById('tt');if(e)e.innerHTML='⏱ '+t;if(t<=0){clearInterval(tm);next(false)}},1000)}function answer(x){next(x===questions[i][2])}function next(ok){if(ok){st++;bst=Math.max(bst,st);s+=20+t}else st=0;i++;if(i>=questions.length)finish();else showQ()}async function finish(){if(window.confetti)confetti({particleCount:200,spread:120});document.getElementById('applause').play().catch(()=>{});try{await fetch(FLOW_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({playerName:p,score:s,badge:badge(s)})})}catch(e){console.error('Power Automate submit failed:',e);}app.innerHTML=`<div class='card result-card'><div style='font-size:60px'>🏆</div><h1>MISSION COMPLETE</h1><div class='badge-box'>${badge(s)}</div><div class='score-big'>${s}</div><p>🔥 Best Streak ${bst}</p><button class='primary' onclick='home()'>Play Again</button></div>`}home();</script></body></html>
