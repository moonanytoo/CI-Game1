<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CI Challenge Game Show Ultimate</title><style>body{margin:0;font-family:Segoe UI,sans-serif;background:linear-gradient(135deg,#0F172A,#1E3A8A,#0EA5E9);color:#fff}.container{max-width:1000px;margin:auto;padding:20px}.hero{background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),url('LEANAI.png');background-size:cover;background-position:center;border-radius:24px;min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;margin-bottom:20px}.card{background:#fff;color:#111827;border-radius:24px;padding:28px;box-shadow:0 15px 35px rgba(0,0,0,.15)}input{width:100%;max-width:550px;display:block;margin:auto;padding:18px;font-size:22px;border:3px solid #D9E8FF;border-radius:18px;text-align:center}.primary{width:100%;max-width:550px;display:block;margin:15px auto 0;padding:18px;border:none;border-radius:14px;background:linear-gradient(135deg,#FF8F1F,#FFB84A);color:#fff;font-size:20px;font-weight:bold}.secondary{width:100%;padding:18px;border:none;border-radius:14px;background:#E5E7EB;color:#111827;font-size:20px;font-weight:600;margin-top:12px;cursor:pointer}.secondary:hover{background:#00A3E0;color:#fff}.progress{height:12px;background:#EAF2FF;border-radius:20px;overflow:hidden}.bar{height:12px;background:linear-gradient(90deg,#00A3E0,#00D084)}.timer{text-align:center;color:#E11D48;font-size:42px;font-weight:bold}.score{font-size:22px;font-weight:bold;color:#00A3E0}</style></head><body><div id="app" class="container"></div><script>const FLOW_URL='https://default424992fe6af1421590b3fc5eb9c227.b3.environment.api.powerplatform.com/powerautomate/automations/direct/cu/20/workflows/ee283027fe704637bce41e8ed06ec781/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=hs_9P2KreWoZCpXGJb-APZw7FBgw3NAFZMcr0eCdzV8';const questions=[['ขั้นตอนไหนเป็น Waste?',['ลูกค้าส่ง Email มาที่บริษัท','พนักงาน Print เอกสารแล้ว Scan กลับเข้าไปเก็บในระบบ','การรับเรื่อง','การอนุมัติ'],1],['Prompt ไหนดีที่สุด?',['สรุปให้หน่อย','ช่วยดูหน่อย','You are a business analyst. Summarize root cause and actions.','OK'],2],['งานใดเหมาะกับ Automation มากที่สุด?',['สร้างความสัมพันธ์ลูกค้า','ส่ง Report ทุกวัน','Strategic Decision','Coaching'],1],['การปรับปรุง process ควรเริ่มจากอะไร?',['ซื้อ AI','ซื้อ RPA','เพิ่มคน','เข้าใจกระบวนการก่อน'],3],['แนวคิดที่ถูกต้องคือ?',['Lean → AI → Automation','Automation ก่อน','ซื้อ Technology ก่อน','จ้างคนเพิ่ม'],0]];let p='',i=0,s=0,t=15,st=0,bst=0,tm;function badge(x){if(x>=150)return'👑 CI Grand Master';if(x>=120)return'🏆 CI Champion';if(x>=90)return'⚡ Automation Builder';if(x>=60)return'🤖 AI Explorer';return'🏭 Lean Explorer';}function home(){app.innerHTML=`<div class=hero><div><h1>🎮 Escape The Manual Work</h1><p>LEAN • AI • Automation</p></div></div><div class=card><h2>📋 วิธีการเล่น</h2><p>✅ ตอบคำถาม 5 ข้อ เกี่ยวกับ LEAN, AI และ Automation</p><p>⏱ 15 วินาทีต่อข้อ</p><p>🎯 ตอบถูก = 20 คะแนน + เวลาที่เหลือ</p><p>❌ ตอบผิด = 0 คะแนน</p><p>🏆 Grand Master 150+ คะแนน</p><hr><div style='font-size:24px;font-weight:bold;text-align:center;color:#003B8E'>👤 กรุณากรอกชื่อผู้เล่น</div><input id=n placeholder='กรอกชื่อผู้เล่น'><button class=primary onclick='startGame()'>🚀 Start Mission</button></div>`}function startGame(){p=document.getElementById('n').value||'Anonymous';i=0;s=0;st=0;bst=0;showQ()}function showQ(){clearInterval(tm);t=15;let q=questions[i];app.innerHTML=`<div class=card><div class=progress><div class=bar style='width:${((i+1)/questions.length)*100}%'></div></div><h2>ข้อ ${i+1}</h2><h3>${q[0]}</h3><div class=score>🏆 Score : ${s}</div><div class=timer>⏱ ${t}</div>${q[1].map((a,x)=>`<button class=secondary onclick='answer(${x})'>${a}</button>`).join('')}</div>`;tm=setInterval(()=>{t--;let z=document.querySelector('.timer');if(z)z.innerHTML='⏱ '+t;if(t<=0){clearInterval(tm);next(false)}},1000)}function answer(x){document.querySelectorAll('.secondary').forEach(b=>b.disabled=true);next(x===questions[i][2])}function next(ok){if(ok){st++;bst=Math.max(bst,st);s+=20+t}else st=0;i++;i>=questions.length?finish():showQ()}async function finish(){try{await fetch(FLOW_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({playerName:p,score:s,badge:badge(s)})})}catch(e){}app.innerHTML=`<div class=card><h1>🏆 MISSION COMPLETE</h1><h2>${badge(s)}</h2><h3>Score ${s}</h3><p>🔥 Best Streak ${bst}</p><button class=primary onclick='home()'>🔄 Play Again</button></div>`}home();</script></body></html>
