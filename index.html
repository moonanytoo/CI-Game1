<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Game2</title><style>body{margin:0;font-family:Segoe UI,sans-serif;background:linear-gradient(135deg,#003B7A,#00A3E0);color:white}.container{max-width:900px;margin:auto;padding:30px}.card{background:white;color:#222;padding:25px;border-radius:20px}button{width:100%;margin:8px 0;padding:14px;border:none;border-radius:12px;cursor:pointer;font-size:16px}.primary{background:#00A3E0;color:white}.success{background:#16A34A;color:white}.secondary{background:#E5E7EB}.progress{background:#ddd;height:15px;border-radius:20px}.bar{background:#00E5FF;height:15px;border-radius:20px}.leader{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:8px}input{width:100%;padding:12px;border-radius:10px;border:none}.badge{font-size:30px;font-weight:bold}</style></head><body><div class="container" id="app"></div><script>const FLOW_URL='https://default424992fe6af1421590b3fc5eb9c227.b3.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/20/workflows/ee283027fe704637bce41e8ed06ec781/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=hs_9P2KreWoZCpXGJb-APZw7FBgw3NAFZMcr0eCdzV8';const leaderboardData=[{name:'Ann',score:205},{name:'Mike',score:190},{name:'Jenny',score:180},{name:'David',score:170},{name:'Peter',score:150}];const questions=[{category:'Lean',title:'🏭 Waste Hunter',question:'ขั้นตอนไหนเป็น Waste?',options:['ลูกค้าส่ง Email','Print แล้ว Scan กลับเข้าเครื่อง','รับเรื่อง','อนุมัติ'],answer:1},{category:'AI',title:'🤖 AI Wizard',question:'Prompt ไหนดีที่สุด?',options:['สรุปให้หน่อย','ช่วยดูหน่อย','You are a business analyst. Summarize root cause and actions.','OK'],answer:2},{category:'Automation',title:'⚡ Automation Escape',question:'งานใดเหมาะกับ Automation มากที่สุด?',options:['สร้างความสัมพันธ์ลูกค้า','ส่ง Report ทุกวัน','Strategic Decision','Coaching'],answer:1},{category:'ROI',title:'💰 ROI Battle',question:'ควรเริ่มจากอะไร?',options:['ซื้อ AI','ซื้อ RPA','เพิ่มคน','เข้าใจกระบวนการก่อน'],answer:3},{category:'Lean',title:'👑 Final Boss',question:'แนวคิดที่ถูกต้องคือ?',options:['Lean → AI → Automation','Automation ก่อน','ซื้อ Technology ก่อน','จ้างคนเพิ่ม'],answer:0}];let playerName='',current=0,score=0,streak=0,bestStreak=0,timeLeft=15,timer;function getBadge(s){if(s>=150)return '👑 CI Grand Master';if(s>=120)return '🏆 CI Champion';if(s>=90)return '⚡ Automation Builder';if(s>=60)return '🤖 AI Explorer';return '🏭 Lean Explorer';}function renderHome(){app.innerHTML=`<h1>🎮 Escape The Manual Work</h1><div class='card'><input id='playerName' placeholder='ชื่อผู้เล่น'><button class='primary' onclick='startGame()'>▶ Start Mission</button><button class='secondary' onclick='showLeaderboard()'>🏆 Leaderboard</button></div>`;}function startGame(){playerName=document.getElementById('playerName').value||'Anonymous';current=0;score=0;streak=0;bestStreak=0;renderQuestion();}function renderQuestion(){clearInterval(timer);timeLeft=15;const q=questions[current];app.innerHTML=`<h2>${q.title}</h2><div>Player:<b>${playerName}</b><br>Score:<b>${score}</b><br>🔥 Streak:<b>${streak}</b></div><br><div class='progress'><div class='bar' style='width:${((current+1)/questions.length)*100}%'></div></div><br>⏱ <span id='timerValue'>${timeLeft}</span>s<br><br><div class='card'><h3>${q.question}</h3>${q.options.map((x,i)=>`<button class='secondary' onclick='answer(${i})'>${x}</button>`).join('')}</div>`;timer=setInterval(()=>{timeLeft--;let t=document.getElementById('timerValue');if(t)t.innerText=timeLeft;if(timeLeft<=0){clearInterval(timer);nextQuestion(false)}},1000);}function answer(i){nextQuestion(i===questions[current].answer)}function nextQuestion(correct){clearInterval(timer);if(correct){streak++;bestStreak=Math.max(bestStreak,streak);score+=20+timeLeft+(streak>=3?10:0)}else{streak=0}current++;current>=questions.length?finishGame():renderQuestion();}async function submitResult(){const payload={playerName:playerName,score:score,badge:getBadge(score)};try{const r=await fetch(FLOW_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});alert(r.ok?'✅ Submit Score สำเร็จ':'❌ Error '+r.status);}catch(e){alert('❌ ไม่สามารถเชื่อมต่อ Power Automate ได้');}}function showLeaderboard(){app.innerHTML=`<div class='card'><h2>🏆 Hall Of Fame</h2>${leaderboardData.map((x,i)=>`<div class='leader'><span>${i+1}. ${x.name}</span><strong>${x.score}</strong></div>`).join('')}<button class='primary' onclick='renderHome()'>Back</button></div>`;}function finishGame(){app.innerHTML=`<div class='card'><h1>🎉 Mission Complete</h1><div class='badge'>${getBadge(score)}</div><h2>Score: ${score}</h2><p>🔥 Best Streak: ${bestStreak}</p><button class='success' onclick='window.print()'>📄 Export PDF</button><button class='primary' onclick='submitResult()'>📤 Submit Score</button><button class='secondary' onclick='renderHome()'>🔄 Play Again</button></div>`;}renderHome();</script></body></html>
