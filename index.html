<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CI Challenge V3</title><script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script><style>body{margin:0;font-family:Segoe UI,sans-serif;background:linear-gradient(135deg,#0F172A,#1E3A8A,#0EA5E9);color:#fff}.container{max-width:1400px;margin:auto;padding:20px}.hero{text-align:center;margin-bottom:10px}.hero-banner{width:100%;max-width:1200px;max-height:220px;object-fit:contain;display:block;margin:auto;border-radius:16px}.card{background:#fff;color:#111827;border-radius:24px;padding:20px;box-shadow:0 15px 35px rgba(0,0,0,.15)}input{width:100%;max-width:550px;display:block;margin:auto;padding:18px;font-size:22px;border:3px solid #D9E8FF;border-radius:18px;text-align:center}.primary,.secondary{border:none;border-radius:14px;cursor:pointer}.primary{width:100%;max-width:550px;display:block;margin:15px auto 0;padding:18px;background:linear-gradient(135deg,#FF8F1F,#FFB84A);color:#fff;font-size:20px;font-weight:bold}.secondary{width:100%;padding:14px;background:#E5E7EB;font-size:18px;margin-top:10px}.progress{height:12px;background:#EAF2FF;border-radius:20px;overflow:hidden}.bar{height:12px;background:linear-gradient(90deg,#00A3E0,#00D084)}.timer{text-align:center;color:#E11D48;font-size:38px;font-weight:bold}.score{font-size:20px;color:#00A3E0;font-weight:bold}.result-card{text-align:center}.badge-box{display:inline-block;background:#FEF3C7;color:#92400E;padding:12px 24px;border-radius:999px;font-size:26px;font-weight:bold}.score-big{font-size:88px;color:#00A3E0;font-weight:900}</style></head><body><audio id="applause" src="https://www.soundjay.com/human/applause-8.mp3"></audio><div id="app" class="container"></div><script>const questions=[[`ขั้นตอนไหนเป็น Waste?<br><small>Which activity is considered Waste?</small>`,[`ลูกค้าส่ง Email มาที่บริษัท<br><small>Customer sends email</small>`,`พนักงาน Print เอกสารแล้ว Scan กลับเข้าระบบ<br><small>Print and scan back into system</small>`,`การรับเรื่อง<br><small>Receive request</small>`,`การอนุมัติ<br><small>Approval</small>`],1],[`Prompt ไหนดีที่สุด?<br><small>Which prompt is most effective?</small>`,[`สรุปให้หน่อย<br><small>Please summarize</small>`,`ช่วยดูหน่อย<br><small>Help check this</small>`,`You are a business analyst.<br><small>Summarize root cause and actions</small>`,`OK`],2],[`งานใดเหมาะกับ Automation มากที่สุด?<br><small>Which task is most suitable for Automation?</small>`,[`สร้างความสัมพันธ์ลูกค้า<br><small>Build customer relationships</small>`,`ส่ง Report ทุกวัน<br><small>Send daily reports</small>`,`Strategic Decision`,`Coaching`],1],[`การปรับปรุง Process ควรเริ่มจากอะไร?<br><small>Where should process improvement start?</small>`,[`ซื้อ AI`,`ซื้อ RPA`,`เพิ่มคน`,`เข้าใจกระบวนการก่อน<br><small>Understand process first</small>`],3],[`แนวคิดที่ถูกต้องคือ?<br><small>Which approach is correct?</small>`,[`Lean → AI → Automation`,`Automation First`,`Buy Technology First`,`Hire More People`],0]];let i=0,s=0,t=15,bst=0,st=0,tm;function badge(x){if(x>=150)return'👑 CI Grand Master';if(x>=120)return'🏆 CI Champion';if(x>=90)return'⚡ Automation Builder';if(x>=60)return'🤖 AI Explorer';return'🏭 Lean Explorer';}function home(){app.innerHTML=`<div class='hero'><img src='LEANAI.png' class='hero-banner'></div><div class='card'><h2>📋 วิธีการเล่น<br><small>How To Play</small></h2><p>✅ ตอบ 5 ข้อ | Answer 5 Questions</p><p>⏱ 15 วินาทีต่อข้อ | 15 Seconds</p><p>🎯 Correct = 20 + Remaining Time</p><h3>🏆 Achievement Levels</h3><p>👑 CI Grand Master 150+</p><p>🏆 CI Champion 120-149</p><p>⚡ Automation Builder 90-119</p><p>🤖 AI Explorer 60-89</p><p>🏭 Lean Explorer Below 60</p><div style='text-align:center;color:#003B8E;font-size:24px'>👤 Player Name</div><input id='n'><button class='primary' onclick='startGame()'>🚀 Start Mission</button></div>`}function startGame(){i=0;s=0;st=0;bst=0;showQ()}function showQ(){clearInterval(tm);t=15;let q=questions[i];app.innerHTML=`<div class='card'><div class='progress'><div class='bar' style='width:${(i+1)/questions.length*100}%'></div></div><h2>Question ${i+1}</h2><h3>${q[0]}</h3><div class='score'>🏆 Score ${s}</div><div class='timer' id='tt'>⏱ ${t}</div>${q[1].map((a,x)=>`<button class='secondary' onclick='answer(${x})'>${a}</button>`).join('')}</div>`;tm=setInterval(()=>{t--;let e=document.getElementById('tt');if(e)e.innerHTML='⏱ '+t;if(t<=0){clearInterval(tm);next(false)}},1000)}function answer(x){next(x===questions[i][2])}function next(ok){if(ok){st++;bst=Math.max(bst,st);s+=20+t}else st=0;i++;i>=questions.length?finish():showQ()}function finish(){if(window.confetti){confetti({particleCount:200,spread:120});}let a=document.getElementById('applause');if(a)a.play().catch(()=>{});app.innerHTML=`<div class='card result-card'><div style='font-size:90px'>🏆</div><h1>MISSION COMPLETE</h1><p>Mission Accomplished</p><div class='badge-box'>${badge(s)}</div><div class='score-big'>${s}</div><p>Total Score</p><p>🔥 Best Streak ${bst}</p><button class='primary' onclick='home()'>🔄 Play Again</button></div>`}home();</script></body></html>
